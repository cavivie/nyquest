name: Android runtime

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cronet
            api: 24
            min_api: 24
            gradle_task: assembleCronetDebug
            apk: app/build/outputs/apk/cronet/debug/app-cronet-debug.apk
          - backend: cronet
            api: 36
            min_api: 24
            gradle_task: assembleCronetDebug
            apk: app/build/outputs/apk/cronet/debug/app-cronet-debug.apk
          - backend: httpengine
            api: 34
            min_api: 34
            gradle_task: assembleHttpengineDebug
            apk: app/build/outputs/apk/httpengine/debug/app-httpengine-debug.apk
          - backend: httpengine
            api: 36
            min_api: 34
            gradle_task: assembleHttpengineDebug
            apk: app/build/outputs/apk/httpengine/debug/app-httpengine-debug.apk

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android build dependencies
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "ndk;27.2.12479018"
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build Rust runtime library
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          cargo ndk \
            --target x86_64 \
            --platform ${{ matrix.min_api }} \
            --output-dir nyquest-backend-tests/android/app/src/main/jniLibs \
            build --release --locked \
            -p nyquest-backend-tests-android \
            --no-default-features \
            --features ${{ matrix.backend }}

      - name: Build Android app
        run: |
          gradle --project-dir nyquest-backend-tests/android \
            ${{ matrix.gradle_task }} --no-daemon --stacktrace

      - name: Run ${{ matrix.backend }} on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: |
            python3 nyquest-backend-tests/android/server.py &
            server_pid=$!
            trap 'kill ${server_pid}' EXIT
            curl --fail --retry 10 --retry-delay 1 \
              http://127.0.0.1:8765/runtime

            adb logcat -c
            adb install -r "nyquest-backend-tests/android/${{ matrix.apk }}"
            adb shell am start -W \
              -n io.nyquest.runtime/.RuntimeTestActivity

            for attempt in $(seq 1 60); do
              logs=$(adb logcat -d -s NyquestRuntime:I '*:S')
              if echo "${logs}" | grep -q 'NYQUEST_RUNTIME_FAIL'; then
                echo "${logs}"
                exit 1
              fi
              if echo "${logs}" | grep -q 'NYQUEST_RUNTIME_PASS'; then
                echo "${logs}"
                exit 0
              fi
              sleep 2
            done

            adb logcat -d
            echo "Timed out waiting for the Nyquest runtime result"
            exit 1
